<!DOCTYPE html>
<html>
<head>
<title>AyuAI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:#343541;
  color:white;
  font-family:system-ui;
}

/* Layout */
.app {
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar {
  width:260px;
  background:#202123;
  padding:15px;
}

.new-btn {
  width:100%;
  padding:10px;
  background:#343541;
  border:1px solid #555;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* Chat */
.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Topbar */
.topbar {
  padding:12px;
  border-bottom:1px solid #444;
  text-align:center;
  font-weight:bold;
}

/* Messages */
#messages {
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.msg {
  max-width:800px;
  width:100%;
  margin:auto;
  padding:15px;
  border-radius:10px;
  line-height:1.6;
}

.user-msg {
  background:#444654;
}

.bot-msg {
  background:#343541;
}

/* Input */
.input-box {
  display:flex;
  padding:15px;
  background:#40414f;
}

.input-box input {
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#343541;
  color:white;
}

/* Buttons */
button {
  margin-left:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#10a37f;
  color:white;
  cursor:pointer;
}

button:hover {
  opacity:0.8;
}

/* Mic button */
.mic {
  background:#ef4444;
}

/* Mobile */
@media (max-width:768px){
  .sidebar {
    display:none;
  }
}
</style>

</head>

<body>

<div class="app">

<!-- Sidebar -->
<div class="sidebar">
  <button class="new-btn" onclick="newChat()">+ New Chat</button>
</div>

<!-- Chat -->
<div class="chat">

  <div class="topbar">AyuAI 🤖</div>

  <div id="messages"></div>

  <div class="input-box">
    <input id="input" placeholder="Message AyuAI...">
    <button onclick="send()">Send</button>
    <button class="mic" onclick="startVoice()">🎤</button>
  </div>

</div>
</div>

<script>
let history = [];

/* SEND */
async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text,"user-msg");
  input.value="";

  history.push({role:"user",content:text});

  try{
    const res = await fetch("/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        message:text,
        mode:"efficient",
        history:history
      })
    });

    const data = await res.json();

    history.push({role:"assistant",content:data.reply});

    addMessage(data.reply,"bot-msg",true);

    speak(data.reply); // 🔥 VOICE OUTPUT

  }catch{
    addMessage("⚠️ Error","bot-msg");
  }
}

/* MESSAGE */
function addMessage(text,type,typing=false){
  const div = document.createElement("div");
  div.className = "msg " + type;

  document.getElementById("messages").appendChild(div);

  const box = document.getElementById("messages");

  if(typing){
    let i=0;
    function typeEffect(){
      if(i < text.length){
        div.innerText += text.charAt(i);
        i++;
        box.scrollTop = box.scrollHeight;
        setTimeout(typeEffect,8);
      }
    }
    typeEffect();
  } else {
    div.innerText = text;
  }

  box.scrollTop = box.scrollHeight;
}

/* ENTER */
document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key==="Enter") send();
});

/* NEW CHAT */
function newChat(){
  history = [];
  document.getElementById("messages").innerHTML="";
}

/* 🎤 VOICE INPUT */
function startVoice(){
  if(!('webkitSpeechRecognition' in window)){
    alert("Voice not supported");
    return;
  }

  const recognition = new webkitSpeechRecognition();
  recognition.lang = "en-US";

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById("input").value = text;
  };

  recognition.start();
}

/* 🔊 AI SPEAK */
function speak(text){
  const speech = new SpeechSynthesisUtterance(text);

  speech.rate = 1;     // speed
  speech.pitch = 1;    // voice tone
  speech.volume = 1;

  // Optional: choose better voice
  const voices = speechSynthesis.getVoices();
  speech.voice = voices.find(v => v.name.includes("Google")) || voices[0];

  speechSynthesis.cancel(); // stop previous speech
  speechSynthesis.speak(speech);
}
</script>

</body>
</html>
