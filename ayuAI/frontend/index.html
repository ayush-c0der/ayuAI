<!DOCTYPE html>
<html>
<head>
<title>AyuAI Ultimate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#343541;
  color:white;
  font-family:system-ui;
}

/* Layout */
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{
  width:260px;
  background:#202123;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.new-btn{
  padding:10px;
  background:#343541;
  border:1px solid #555;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

.chat-list{margin-top:10px;overflow:auto}
.chat-item{
  padding:8px;
  background:#111;
  border-radius:6px;
  margin-bottom:5px;
  cursor:pointer;
}

/* Chat */
.chat{flex:1;display:flex;flex-direction:column}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #444;
}

#modeBtn{cursor:pointer}

/* Messages */
#messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.msg{
  max-width:800px;
  margin:auto;
  padding:15px;
  border-radius:10px;
  line-height:1.6;
}

.user-msg{background:#444654}
.bot-msg{background:#343541}

/* Typing indicator */
.typing{
  font-size:20px;
  opacity:0.7;
  animation:blink 1s infinite;
}
@keyframes blink{
  0%{opacity:0.2}
  50%{opacity:1}
  100%{opacity:0.2}
}

/* Input */
.input-box{
  display:flex;
  padding:10px;
  background:#40414f;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#343541;
  color:white;
}

button{
  margin-left:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#10a37f;
  color:white;
  cursor:pointer;
}

.mic{background:#ef4444}

/* Mobile */
@media(max-width:768px){
  .sidebar{display:none}
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">
  <button class="new-btn" onclick="newChat()">+ New Chat</button>
  <div id="chat-list" class="chat-list"></div>
</div>

<div class="chat">

<div class="topbar">
  <span>AyuAI 🤖</span>
  <span id="modeBtn" onclick="changeMode()">⚡ Efficient</span>
</div>

<div id="messages"></div>

<div class="input-box">
  <input id="input" placeholder="Message AyuAI...">
  <button onclick="send()">Send</button>
  <button class="mic" onclick="startVoice()">🎤</button>
</div>

</div>
</div>

<script>
let history=[];
let chats=[];
let currentChatIndex=-1;
let mode="efficient";
let userName=null;

/* MODE */
function changeMode(){
  if(mode==="efficient"){mode="smart";update("🧠 Smart")}
  else if(mode==="smart"){mode="assistant";update("🎤 Assistant");startAssistant()}
  else{mode="efficient";update("⚡ Efficient")}
}

function update(text){
  document.getElementById("modeBtn").innerText=text;
}

/* SEND */
async function send(textFromVoice=null){
  const input=document.getElementById("input");
  const text=textFromVoice||input.value.trim();
  if(!text) return;

  addMessage(text,"user-msg");
  input.value="";

  history.push({role:"user",content:text});

  showTyping();

  try{
    const res=await fetch("/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({message:text,mode:"efficient",history})
    });

    const data=await res.json();

    removeTyping();

    let reply=data.reply;

    // 🧠 MEMORY
    if(text.toLowerCase().includes("my name is")){
      userName=text.split("is")[1].trim();
      reply="Nice to meet you "+userName+" 😊";
    }

    if(userName && reply.includes("Hello")){
      reply=reply.replace("Hello","Hello "+userName);
    }

    history.push({role:"assistant",content:reply});

    addMessage(reply,"bot-msg",true);
    speak(reply);

    saveChat();

  }catch{
    removeTyping();
    addMessage("⚠️ Error","bot-msg");
  }
}

/* MESSAGE */
function addMessage(text,type,typing=false){
  const div=document.createElement("div");
  div.className="msg "+type;
  document.getElementById("messages").appendChild(div);

  const box=document.getElementById("messages");

  if(typing){
    let i=0;
    function typeAnim(){
      if(i<text.length){
        div.innerText+=text[i++];
        box.scrollTop=box.scrollHeight;
        setTimeout(typeAnim,8);
      }
    }
    typeAnim();
  }else div.innerText=text;

  box.scrollTop=box.scrollHeight;
}

/* TYPING */
let typingDiv=null;
function showTyping(){
  typingDiv=document.createElement("div");
  typingDiv.className="msg bot-msg typing";
  typingDiv.innerText="...";
  document.getElementById("messages").appendChild(typingDiv);
}
function removeTyping(){
  if(typingDiv) typingDiv.remove();
}

/* ENTER */
document.getElementById("input").addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});

/* CHAT SAVE */
function saveChat(){
  if(currentChatIndex===-1){
    chats.push([...history]);
    currentChatIndex=chats.length-1;
  }else chats[currentChatIndex]=[...history];

  renderChatList();
}

function renderChatList(){
  const list=document.getElementById("chat-list");
  list.innerHTML="";

  chats.forEach((c,i)=>{
    const item=document.createElement("div");
    item.className="chat-item";
    item.innerText=c[0]?.content.slice(0,20)||"Chat";
    item.onclick=()=>loadChat(i);
    list.appendChild(item);
  });
}

function loadChat(i){
  history=[...chats[i]];
  currentChatIndex=i;

  const box=document.getElementById("messages");
  box.innerHTML="";

  history.forEach(m=>{
    addMessage(m.content,m.role==="user"?"user-msg":"bot-msg");
  });
}

/* NEW CHAT */
function newChat(){
  history=[];
  currentChatIndex=-1;
  document.getElementById("messages").innerHTML="";
}

/* 🎤 VOICE INPUT */
function startVoice(){
  const rec=new webkitSpeechRecognition();
  rec.lang="en-US";

  rec.onresult=e=>{
    const text=e.results[0][0].transcript;
    document.getElementById("input").value=text;
  };

  rec.start();
}

/* 🤖 ASSISTANT MODE */
function startAssistant(){
  const rec=new webkitSpeechRecognition();
  rec.continuous=true;
  rec.lang="en-US";

  rec.onresult=e=>{
    const text=e.results[e.results.length-1][0].transcript;
    send(text);
  };

  rec.start();
}

/* 🔊 SPEAK */
function speak(text){
  const s=new SpeechSynthesisUtterance(text);
  s.rate=1;
  speechSynthesis.cancel();
  speechSynthesis.speak(s);
}
</script>

</body>
</html>
