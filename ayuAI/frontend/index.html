<!DOCTYPE html>
<html>
<head>
<title>AyuAI</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  background:#0f172a;
  color:white;
  font-family:system-ui;
}

/* Layout */
.app {
  display:flex;
  height:100vh;
}

/* Sidebar */
.sidebar {
  width:240px;
  background:#020617;
  padding:15px;
}

.new-btn {
  width:100%;
  padding:10px;
  background:#1e293b;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* Chat */
.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* Topbar */
.topbar {
  display:flex;
  justify-content:space-between;
  padding:12px 20px;
  border-bottom:1px solid #1e293b;
  background:#020617;
}

.logo {
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img {
  width:35px;
}

/* Dropdown */
.dropdown {
  position:relative;
}

#ai-name {
  cursor:pointer;
}

.menu {
  display:none;
  position:absolute;
  right:0;
  top:30px;
  background:#111827;
  border-radius:8px;
  padding:10px;
}

.menu div {
  padding:8px;
  cursor:pointer;
}

.menu div:hover {
  background:#1e293b;
}

/* Messages */
#messages {
  flex:1;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
  overflow-y:auto;
}

.msg {
  padding:14px 18px;
  border-radius:16px;
  max-width:70%;
  line-height:1.6;
  white-space:pre-wrap;
}

.user-msg {
  background:#2563eb;
  align-self:flex-end;
}

.bot-msg {
  background:#1e293b;
}

/* Input */
.input-box {
  display:flex;
  padding:10px;
  background:#020617;
}

.input-box input {
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#111827;
  color:white;
}

.input-box button {
  margin-left:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

/* 📱 MOBILE */
@media (max-width:768px){
  .sidebar {
    display:none;
  }

  .msg {
    max-width:90%;
  }
}
</style>

</head>

<body class="efficient">

<div class="app">

<!-- Sidebar -->
<div class="sidebar">
  <button class="new-btn" onclick="newChat()">+ New Chat</button>
</div>

<!-- Chat -->
<div class="chat">

  <!-- Topbar -->
  <div class="topbar">
    <div class="logo">
      <img src="logo.png">
      <span>AyuAI</span>
    </div>

    <div class="dropdown">
      <span id="ai-name" onclick="toggleMenu()">⚡ Efficient ▼</span>

      <div id="menu" class="menu">
        <div onclick="setMode('efficient')">⚡ Efficient</div>
        <div onclick="setMode('smart')">🧠 Smart</div>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Input -->
  <div class="input-box">
    <input id="input" placeholder="Message AyuAI...">
    <button onclick="send()">➤</button>
  </div>

</div>
</div>

<script>
let history = [];
let currentMode = "efficient";

/* MENU */
function toggleMenu(){
  const m = document.getElementById("menu");
  m.style.display = m.style.display === "block" ? "none" : "block";
}

/* MODE */
function setMode(mode){
  currentMode = mode;
  document.body.className = mode;

  document.getElementById("menu").style.display = "none";
  document.getElementById("ai-name").innerText =
    mode === "smart" ? "🧠 Smart ▼" : "⚡ Efficient ▼";
}

/* SEND */
async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;

  addMessage(text,"user-msg");
  input.value="";

  history.push({role:"user",content:text});

  try{
    const res = await fetch("/chat",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        message:text,
        mode:currentMode,
        history:history
      })
    });

    const data = await res.json();

    history.push({role:"assistant",content:data.reply});

    addMessage(data.reply,"bot-msg",true);

  }catch{
    addMessage("⚠️ Error","bot-msg");
  }
}

/* MESSAGE WITH TYPING */
function addMessage(text,type,typing=false){
  const div = document.createElement("div");
  div.className = "msg " + type;

  document.getElementById("messages").appendChild(div);

  const box = document.getElementById("messages");

  if(typing){
    let i=0;
    function typeEffect(){
      if(i < text.length){
        div.innerText += text.charAt(i);
        i++;
        box.scrollTop = box.scrollHeight;
        setTimeout(typeEffect,15);
      }
    }
    typeEffect();
  } else {
    div.innerText = text;
  }

  box.scrollTop = box.scrollHeight;
}

/* ENTER KEY */
document.getElementById("input").addEventListener("keydown", e=>{
  if(e.key==="Enter") send();
});

/* NEW CHAT */
function newChat(){
  history = [];
  document.getElementById("messages").innerHTML="";
}
</script>

</body>
</html>
